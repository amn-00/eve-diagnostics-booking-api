[pytest]
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings =
    # sqlite has no native decimal type; only relevant for the default in-memory test db
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using `httpx` with `starlette.testclient`
